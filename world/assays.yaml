service_lines:
- id: medchem
  name: Medicinal chemistry
- id: invitro
  name: In vitro biology and screening
- id: dmpk
  name: DMPK and bioanalysis
- id: compchem
  name: Bioinformatics and computational chemistry
- id: analytical
  name: Analytical chemistry and stability testing
- id: formulation
  name: Formulation and early CMC
- id: tox
  name: Toxicology
assays:
- id: synthesis
  name: Custom synthesis and analogue preparation
  service_line: medchem
  endpoint: synthesis
  units: '% yield / % purity'
  variants:
    A:
    - Analogue preparation
    - Route scout and delivery
- id: herg
  name: hERG patch clamp
  service_line: invitro
  endpoint: herg_ic50
  units: µM
  variants:
    B:
    - hERG automated patch clamp
    - hERG channel screen
    C:
    - IKr inhibition
    G:
    - hERG (IKr) safety pharmacology
- id: cyp_inhib
  name: CYP inhibition panel (1A2/2C9/2C19/2D6/3A4) at 10 µM
  service_line: invitro
  endpoint: cyp_pct
  units: '% inhibition'
  variants:
    B:
    - 5-isoform CYP panel
    C:
    - Five-isoform DDI screen
    G:
    - CYP safety interaction panel
- id: cyp_ic50
  name: CYP3A4 inhibition IC50
  service_line: invitro
  endpoint: cyp_ic50
  units: µM
  variants:
    B:
    - 3A4 concentration response
    C:
    - CYP3A4 inhibition curves
    G:
    - CYP3A4 follow-up IC50
- id: kinase_primary
  name: Primary kinase IC50
  service_line: invitro
  endpoint: kinase_ic50
  units: nM
  variants:
    B:
    - Primary potency assay
    - Kinase concentration response
- id: kinase_panel
  name: Kinase selectivity panel
  service_line: invitro
  endpoint: kinase_panel
  units: '% inhibition at 1 µM'
  variants:
    B:
    - Selectivity sweep
    - Off-target kinase panel
- id: mic_stab
  name: Liver microsomal stability
  service_line: dmpk
  endpoint: mic_clint
  units: µL/min/mg
  variants:
    B:
    - HLM/RLM stability
    - Met stab
    C:
    - Microsomal CLint
- id: hep_stab
  name: Hepatocyte stability
  service_line: dmpk
  endpoint: hep_clint
  units: µL/min/10^6 cells
  variants:
    B:
    - Fresh hepatocyte turnover
    C:
    - Hepatocyte depletion CLint
- id: ppb
  name: Plasma protein binding (equilibrium dialysis)
  service_line: dmpk
  endpoint: ppb
  units: '% bound'
  variants:
    B:
    - RED PPB
    C:
    - fu,p by equilibrium dialysis
- id: caco2
  name: Caco-2 permeability
  service_line: dmpk
  endpoint: caco2
  units: 10^-6 cm/s
  variants:
    B:
    - Bidirectional Caco-2
    C:
    - Caco-2 flux and efflux ratio
- id: solubility
  name: Kinetic solubility
  service_line: dmpk
  endpoint: solubility
  units: µM
  variants:
    B:
    - Kinetic solubility screen
    C:
    - DMSO-dilution solubility
- id: rodent_pk
  name: Rodent pharmacokinetics with LC-MS/MS bioanalysis
  service_line: dmpk
  endpoint: pk
  units: mixed
  variants:
    C:
    - Rat exposure with tandem-MS bioanalysis
    - Oral/IV PK
- id: comp_screen
  name: Virtual screening and docking
  service_line: compchem
  endpoint: docking
  units: kcal/mol
  variants:
    D:
    - Virtual library triage
    - Docking and hit clustering
- id: bioinf
  name: Bioinformatics analysis (target ID, omics, NGS)
  service_line: compchem
  endpoint: none
  units: ''
  variants:
    D:
    - RNA-seq differential expression
    - Omics target prioritisation
    - NGS reanalysis
- id: stability
  name: ICH stability study
  service_line: analytical
  endpoint: stability
  units: '% label claim / % area'
  variants:
    E:
    - ICH chamber programme
    - Stability pulls
- id: method_val
  name: HPLC method development and validation
  service_line: analytical
  endpoint: method_val
  units: mixed
  variants:
    E:
    - Assay and related-substances validation
    - HPLC method qualification
- id: form_screen
  name: Formulation screening
  service_line: formulation
  endpoint: formulation
  units: mg/mL
  variants:
    F:
    - Vehicle ladder
    - Excipient compatibility screen
- id: cytotox
  name: In vitro cytotoxicity (HepG2)
  service_line: tox
  endpoint: cytotox_ic50
  units: µM
  variants:
    G:
    - HepG2 viability screen
- id: ames
  name: Bacterial reverse mutation (Ames)
  service_line: tox
  endpoint: ames
  units: revertants/plate
  variants:
    G:
    - Bacterial mutation assay with and without S9
- id: micronucleus
  name: In vitro micronucleus
  service_line: tox
  endpoint: micronucleus
  units: '% MN cells'
  variants:
    G:
    - Mammalian-cell micronucleus assessment
- id: drf
  name: Rodent dose-range-finding study
  service_line: tox
  endpoint: drf
  units: mg/kg/day
  variants:
    G:
    - Exploratory rat range finding
    - Rat DRF and recovery
