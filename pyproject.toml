[project]
name = "mockgen"
version = "0.1.0"
description = "Generator for the portco mock document archive (DEV-1370)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "python-pptx", "openpyxl", "python-docx", "reportlab", "pypdf",
  "pillow", "pdf2image", "matplotlib", "rdkit", "scikit-learn",
  "faker", "pydantic>=2", "pyyaml", "filelock", "rapidfuzz", "numpy", "pandas",
  "pytesseract",
]

[project.optional-dependencies]
golden = ["unstructured[pdf,pptx,docx,xlsx]"]

[project.scripts]
mockgen = "mockgen.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockgen"]
