- file_id: P10
  verdict: minor
  issues:
    - severity: minor
      area: science
      where: "section 3, hERG automated patch clamp"
      problem: "A fixed 3-5 minute exposure does not establish equilibrium for slow-onset hERG blockers; no plateau or extension rule is stated."
      suggested_change: "State that tail current must stabilise before moving to the next concentration; extend exposure or flag non-equilibrated recordings."
    - severity: minor
      area: realism
      where: "section 3, assay methods"
      problem: "The quotation describes unperformed work in the past tense ('were recorded', 'were incubated')."
      suggested_change: "Use prospective wording: 'will be recorded', 'will be incubated' and 'will be applied'."
    - severity: minor
      area: consistency
      where: "section 5 Timeline"
      problem: "The quoted 15 working days differs in basis from the 15 calendar days recorded in P11/P12; it should not be read as the achieved turnaround."
      suggested_change: "Label this as the quoted maximum; retain the actual 12-27 September interval as 15 calendar days in the completed-study documents."
- file_id: P11
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "sheet hERG run sheet, E3 comment and AP02-01428/AP02-01506/AP02-01524"
      problem: "The comment says censored replicates are excluded, but a finite replicate paired with >30 produces a mean of >30. For AP02-01428, excluding >30 would leave 21, not >30. Mixed censoring cannot establish a geometric mean above 30."
      suggested_change: "Use a documented censoring rule and mark mixed finite/censored summaries as indeterminate or as justified bounds; retain the individual results and reconcile the benchmark summary."
    - severity: fix
      area: science
      where: "sheet Plate acceptance"
      problem: "CYP controls are declared passing 'within 3-fold of historical mean' without giving the reference means or numeric limits. 'Result' also mixes hERG nM and CYP µM without units in this sheet."
      suggested_change: "Label results as IC50 with an explicit unit column and provide the applicable historical reference or acceptance interval for each CYP control."
    - severity: minor
      area: consistency
      where: "sheet Plate acceptance, final statement"
      problem: "'All runs met plate acceptance criteria' conflicts with run-sheet notes identifying rejected E-4031 runs that were repeated."
      suggested_change: "Replace with 'All reported results derive from accepted runs; failed runs were excluded and repeated.'"
- file_id: P12
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "page 2 Methods and page 3 Table 2"
      problem: "Methods specify an IC50 fitted to mean inhibition, whereas P11 describes geometric means of cell-level IC50s. Table 2 also reports >30 summaries for mixed finite/>30 replicates, including AP02-01428 (21 and >30), without a valid aggregation rule."
      suggested_change: "Describe the actual per-cell fitting and aggregation procedure, state how censoring is handled, and replace unsupported mixed-censoring summaries with justified bounds or indeterminate results."
    - severity: fix
      area: science
      where: "page 2 CYP methods and page 5 control footnote"
      problem: "Five CYP control IC50s are reported, but only a single-concentration test protocol is described; control dilution ranges, acceptance limits and any NADPH preincubation for furafylline/ticlopidine are absent. The blanket acceptance claim cannot be assessed from the report."
      suggested_change: "Add the separate control concentration-response procedure, actual preincubation conditions and numerical acceptance limits; identify the accepted runs after repeats."
    - severity: minor
      area: science
      where: "page 5 Conclusion"
      problem: "'Widest hERG margin' implies a safety margin although no exposure or potency denominator is supplied."
      suggested_change: "Say 'highest measured hERG IC50 values', and reserve safety-margin assessment for comparison with unbound exposure."
