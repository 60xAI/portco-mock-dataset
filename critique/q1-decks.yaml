      problem: "The 40 candidate genes, seven ranked targets, two exclusions, three assays and within-quarter delivery are invented engagement facts absent from the pack. Calling them engagement counts rather than assay results does not establish their provenance."
      suggested_change: "Remove the unsupported quantities and timing: 'Combined patient-tissue RNA-seq, genetic evidence and pathway context to prioritise candidate targets; flagged broad tissue expression risks; the client commissioned follow-up cell assays with Brindlewythe.' Delete the numerical justification in the notes."
