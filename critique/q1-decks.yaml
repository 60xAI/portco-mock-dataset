- file_id: P09
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "slide 9"
      problem: "A volcano plot's y-axis is described as 'confidence (adjusted p-value)' while high points are called confident. Raw adjusted p-values run in the opposite direction; p-values are not confidence probabilities."
      suggested_change: "Use 'x-axis: log2 fold change', 'y-axis: -log10(adjusted p-value)' and 'Upper corners: large changes with small adjusted p-values; assess biological relevance and replication separately'."
    - severity: fix
      area: science
      where: "slide 8"
      problem: "RNA-seq is said to count the RNA copies of each gene in a sample. Conventional RNA-seq measures sampled reads/fragments and estimates relative transcript abundance, not absolute copy counts."
      suggested_change: "Use 'Sequence sampled RNA-derived fragments and estimate relative transcript abundance after normalisation'."
    - severity: minor
      area: science
      where: "slide 10"
      problem: "'Check cell numbers' alone omits independent biological replication; many cells from one donor do not provide many independent samples. The internal-training framing is otherwise a plausible distractor."
      suggested_change: "Use 'Check donor/sample replication, cell numbers and batch effects; cells from one donor are not independent biological replicates'. Keep the internal training title, exercises and instructional format."
