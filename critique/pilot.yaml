      suggested_change: "Add operational instructions and specimen forms covering investigation/animal identity, card versions, reconciliation, exceptions and indexed transfer."
    - severity: minor
      area: realism
      where: "page 2 approval block"
      problem: "Controlled approval signatures are rendered as italic surnames with no indication of an electronic approval record."
      suggested_change: "Use plausible signed approvals or explicitly identify the controlled electronic approval mechanism."

