- file_id: B-008
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "slides 4, 6 and 7"
      problem: "Ranking claims one compound has the fewest panel hits above 50%, but AP02-01410 and AP02-01430 each have one. Their primary IC50s are 617 and 144 nM, so potency is not interchangeable; no nominated or rejected compound is named."
      suggested_change: "Name the reserve selected by Avernelwick, show primary IC50 and panel-hit count for each candidate, and explain the tie-break. Identify both rejected compounds and the evidence for rejection."
    - severity: fix
      area: consistency
      where: "slide 9"
      problem: "The completed project's outcome is that Avernelwick selected a reserve, but the final readout still leaves Avernelwick to choose one."
      suggested_change: "Record the selected compound and next chemistry action; label any earlier recommendation separately from the final client decision."
    - severity: fix
      area: science
      where: "slide 3"
      problem: "Z' >= 0.6, universal control acceptance, no signal interference and two dispensing-error repeats are asserted without run identifiers, control results, acceptance limits or the repeated compound IDs."
      suggested_change: "Provide the underlying plate-acceptance summary and repeat identifiers from available study records; otherwise qualify these assertions as unsubstantiated rather than inventing acceptance results."
    - severity: minor
      area: realism
      where: "slides 4-6"
      problem: "The table and chart labels are small relative to the large unused slide areas; the linear IC50 chart makes low-nM compounds difficult to distinguish."
      suggested_change: "Enlarge tables and labels and show a ranked log-scale potency chart or a focused shortlist alongside the full screening set."
