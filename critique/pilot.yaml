      where: "sections 4.0 and 5.6"
      problem: "Control validity is reduced to vehicle and reference groups falling within historical expectations. Not every in vivo investigation has a reference group, and historical ranges alone do not establish validity."
      suggested_change: "Assess concurrent controls, protocol-specific criteria, dosing and observation integrity, with historical data used as supporting context where applicable."
    - severity: fix
