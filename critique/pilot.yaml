- file_id: G-026
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "section 2.0"
      problem: "Exploratory investigations follow only sections 5.1–5.5, excluding both control-validity review and archive release. This conflicts with reconstructable records and the stated distinction between data-integrity review and GLP certification."
      suggested_change: "Require proportionate control review and indexed retention for exploratory investigations; distinguish GLP QA requirements separately."
    - severity: fix
