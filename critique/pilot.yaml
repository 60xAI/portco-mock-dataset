- file_id: C-037
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "section 2, analytical-limits footnote"
      problem: "The <20% depletion rule is paired with half-life bounds >60 and >120 min, despite 45-min microsomal and 120-min hepatocyte incubations. Those bounds do not represent the stated threshold."
      suggested_change: "Derive reporting bounds from the actual incubation and quantifiable depletion threshold; distinguish fitted half-lives from censored values."
    - severity: fix
      area: science
      where: "sections 2–3"
      problem: "Microsomal metabolism is proposed without specifying NADPH, incubation temperature, or controls for non-metabolic parent loss."
      suggested_change: "State cofactor and temperature conditions, include no-NADPH controls, and explain how nonspecific loss affects CLint reporting."
    - severity: fix
      area: realism
      where: "whole document, pages 1–2"
      problem: "The seven-page quotation is a two-page outline. Matrix acceptance criteria, calculation conventions and exceptions to the blanket 1 nM LLOQ promise are absent."
      suggested_change: "Expand the substantive analytical scope, acceptance criteria and reporting limitations rather than adding padding."
    - severity: minor
      area: realism
      where: "page break between sections 4 and 5"
      problem: "The deliverables list splits after its first bullet; page 2 opens with detached bullets and is mostly empty."
      suggested_change: "Keep the deliverables list together and rebalance pagination."

- file_id: E-037
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "page 1, Table 1 and specification footnote"
      problem: "The footnote limits any unspecified impurity to 0.20%, yet the six-month accelerated row reports Imp A 0.35% and Imp B 0.21% as 'Complies'; three-month Imp A is already 0.21%. No separate specified-impurity limits are supplied."
      suggested_change: "Identify whether A and B are specified impurities and provide their approved limits; otherwise flag the affected rows and discuss the failure."
    - severity: fix
      area: science
      where: "section 3.1"
      problem: "The report suggests moisture-driven hydrolysis from a temperature/RH trend alone. It omits the available water-KF column and gives no degradant identification or humidity-controlled comparison."
      suggested_change: "Include water results and describe hydrolysis as a hypothesis requiring confirmation; retain the moisture-barrier recommendation with that limitation."
    - severity: fix
      area: realism
      where: "whole report"
      problem: "The intended 32-page signed stability report renders as two pages, with page 2 containing only signatures. Packaging configuration, method references, system suitability and supporting analytical records are missing."
      suggested_change: "Add the protocol, packaging, methods, acceptance criteria and traceable supporting results needed for an auditable report."
    - severity: fix
      area: realism
      where: "page 1 annotations and page 2 signatures"
      problem: "The approval stamp is bold and sharp rather than faint; the handwritten note crosses '4.1 None'. Signatures are visibly italic typeset surnames, undermining the signed-scan premise."
      suggested_change: "Use plausible handwritten signatures, a faint uneven approval stamp, and a margin note that leaves the deviations statement readable."

