- file_id: P32
  verdict: fix
  issues:
    - severity: fix
      area: science
      where: "Table 4 Human plasma protein binding, fu column"
      problem: "The fu values are percentages, not fractions: 92.0% bound is paired with fu 8.01 rather than approximately 0.0801. This creates a hundredfold unit error if used as fu,p."
      suggested_change: "Rename the column 'Unbound (%)' while retaining the values, or divide values by 100 and label it 'fu,p (unitless)'."
    - severity: fix
      area: science
      where: "Section 2 Analytical limits"
      problem: "Low depletion is reported as a 'lower bound'. Insufficient depletion provides an upper bound on CLint and a lower bound on half-life; the current sentence does not distinguish them."
      suggested_change: "Replace with: 'When depletion is below 20%, CLint is reported as an upper bound and half-life as a lower bound at the assay's quantitation limit.'"
    - severity: fix
      area: science
      where: "Section 4 Results, first paragraph"
      problem: "The claim of broadly similar microsomal/hepatocyte ranking is contradicted by prominent rows: CVL-08816 has human microsomal CLint 4.4 but hepatocyte CLint 36, whereas CVL-08968 has 65 and 17. No lipophilicity data support the accompanying lipophilicity claim."
      suggested_change: "Replace with: 'Microsomal and hepatocyte rankings differ for several analogues, including CVL-08816 and CVL-08968; these discrepancies warrant follow-up.' Remove the lipophilicity attribution unless supporting measurements are supplied."
    - severity: fix
      area: science
      where: "Section 1 Summary"
      problem: "Higher rat in vitro intrinsic clearance alone does not establish that rodent exposure will under-represent human exposure. Rat binding is explicitly unmeasured, and absorption and species scaling are unresolved."
      suggested_change: "Replace the exposure inference with: 'Rat intrinsic clearance is generally higher in these assays; the effect on in vivo exposure requires species-specific binding and PK assessment.'"
